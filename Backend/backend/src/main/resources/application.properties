# ========================================
# Application Config
# ========================================
spring.application.name=travel-memory-vault

# ========================================
# Database Configuration
# Use environment variables in production!
# ========================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/travel_memory_vault?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Rishi@2207}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================================
# JPA / Hibernate
# ========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ========================================
# JWT Configuration
# Required for every environment; never put the signing secret in source control.
# Generate a secure value with PowerShell's cryptographic random-number generator.
# ========================================
jwt.secret=${JWT_SECRET}
jwt.expiration.ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.photo-storage.directory=${PHOTO_STORAGE_PATH:./data/private-photos}
app.photo-storage.max-file-size-bytes=${PHOTO_MAX_FILE_SIZE_BYTES:5242880}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ========================================
# Server
# ========================================
server.port=${PORT:8080}

# ========================================
# SpringDoc / Swagger UI
# Access at: http://localhost:8080/swagger-ui.html
# ========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.show-actuator=false

# ========================================
# Logging (never log JWT tokens or passwords)
# ========================================
logging.level.com.travelmemoryvault=INFO
logging.level.org.springframework.security=WARN